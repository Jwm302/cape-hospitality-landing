<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <defs>
    <linearGradient id="facetGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddc38f"/>
      <stop offset="100%" stop-color="#caa66e"/>
    </linearGradient>
    <linearGradient id="facetGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caa66e"/>
      <stop offset="100%" stop-color="#9e7b46"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. TABLE MOUNTAIN & RIDGELINE SILHOUETTE   -->
  <!-- ========================================== -->

  <!-- Western dark navy shadow face (behind towers) -->
  <polygon points="330,366 330,446 425,438 425,282 390,320" fill="#0c2340"/>

  <!-- Western sunlit golden facets -->
  <polygon points="425,282 458,355 420,380 395,330" fill="url(#facetGold1)"/>
  <polygon points="425,282 470,290 495,370 458,355" fill="url(#facetGold2)"/>
  <polygon points="458,355 495,370 520,392 460,392" fill="#9e7b46"/>
  <polygon points="495,370 545,388 510,398 475,395" fill="#caa66e" opacity="0.85"/>

  <!-- Table Mountain Flat Plateau Summit Line -->
  <path d="M 470 290 L 675 292" stroke="#0c2340" stroke-width="6" stroke-linecap="round"/>

  <!-- Downward vertical couloir shadow clefts hanging into white mountain face -->
  <path d="M 495 290 L 498 322 L 504 312 L 508 326 L 512 290 Z" fill="#0c2340"/>
  <path d="M 536 290 L 540 328 L 546 316 L 552 334 L 558 290 Z" fill="#0c2340"/>
  <path d="M 580 290 L 585 342 L 592 324 L 600 350 L 606 290 Z" fill="#0c2340"/>
  <path d="M 628 290 L 634 332 L 640 318 L 646 338 L 652 291 Z" fill="#0c2340"/>
  <path d="M 668 291 L 672 328 L 676 314 L 682 336 L 686 292 Z" fill="#0c2340"/>

  <!-- Eastern Ridgeline: Saddle dropping down, rising into Lion's Head & Signal Hill -->
  <path d="M 675 292 L 698 324 L 735 348 L 768 340 L 795 332 L 815 352 L 835 368 L 865 358 L 895 378 L 928 402"
        stroke="#0c2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Golden crest accent on Lion's Head -->
  <polygon points="795,332 815,352 805,354 788,338" fill="#caa66e"/>

  <!-- ========================================== -->
  <!-- 2. MODERN CITY TOWERS (5 Pillars)          -->
  <!-- ========================================== -->

  <!-- Tower 1 (Gold, angled roof up-right) -->
  <polygon points="165,453 165,350 184,324 184,453" fill="#caa66e"/>

  <!-- Tower 2 (Gold, angled roof up-right) -->
  <polygon points="191,453 191,308 212,280 212,453" fill="#caa66e"/>

  <!-- Tower 3 (Centerpiece Skyscraper) -->
  <!-- Left Half: Navy Blue -->
  <polygon points="219,453 219,256 240,230 240,453" fill="#0c2340"/>

  <!-- Right Half: Architectural Gold Tower with Cutout Facade -->
  <polygon points="248,453 248,230 294,262 294,453" fill="#caa66e"/>
  <!-- White inner window gap -->
  <polygon points="256,446 256,244 286,266 286,446" fill="#ffffff"/>
  <!-- Inner gold pillar -->
  <polygon points="262,446 262,252 280,268 280,446" fill="#caa66e"/>

  <!-- Tower 4 (Gold, angled roof) -->
  <polygon points="304,449 304,334 324,348 324,449" fill="#caa66e"/>

  <!-- Tower 5 (Bronze, angled roof) -->
  <polygon points="330,446 330,356 348,368 348,446" fill="#9e7b46"/>

  <!-- ========================================== -->
  <!-- 3. SILHOUETTED PALM TREE                   -->
  <!-- ========================================== -->
  <ellipse cx="152" cy="455" rx="8" ry="2" fill="#0c2340"/>
  <!-- Curved trunk -->
  <path d="M 149 455 Q 153 400 156 355 L 160 355 Q 157 400 155 455 Z" fill="#0c2340"/>
  <!-- Fronds -->
  <path d="M 158 355 C 140 345, 120 355, 115 372 C 125 365, 142 360, 158 355 Z" fill="#0c2340"/>
  <path d="M 158 355 C 138 335, 122 340, 116 352 C 128 344, 144 345, 158 355 Z" fill="#0c2340"/>
  <path d="M 158 355 C 145 325, 150 315, 154 310 C 158 322, 158 338, 158 355 Z" fill="#0c2340"/>
  <path d="M 158 355 C 168 332, 180 338, 188 350 C 176 346, 166 348, 158 355 Z" fill="#0c2340"/>
  <path d="M 158 355 C 170 355, 184 365, 188 376 C 178 368, 168 364, 158 355 Z" fill="#0c2340"/>

  <!-- ========================================== -->
  <!-- 4. WATERLINE & GOLDEN BEACH COVE           -->
  <!-- ========================================== -->
  <!-- Baseline tapering across to the right -->
  <path d="M 80 456 L 275 452 L 928 402 L 928 406 L 275 455 L 80 458 Z" fill="#0c2340"/>
  <path d="M 275 455 L 928 406 L 928 408 L 275 456 Z" fill="#b48c58"/>

  <!-- Golden Beach Cove -->
  <path d="M 662 420 C 720 445, 810 456, 928 456 C 820 440, 730 430, 662 420 Z" fill="#caa66e"/>
  <path d="M 708 438 C 760 452, 830 458, 920 458 C 835 450, 770 442, 708 438 Z" fill="#b48c58" opacity="0.8"/>
  <!-- Wave ripples inside bay -->
  <path d="M 710 428 C 760 436, 815 440, 875 438" stroke="#0c2340" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 740 436 C 785 442, 830 444, 870 443" stroke="#0c2340" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- ========================================== -->
  <!-- 5. TYPOGRAPHY (MATCHING UPLOADED PICTURE)  -->
  <!-- ========================================== -->
  <!-- Brand Wordmark: C A P E -->
  <text x="500" y="592" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif" font-size="112" font-weight="700" letter-spacing="30" fill="#0c2340">CAPE</text>

  <!-- Subtitle: HOSPITALITY AUDITORS -->
  <text x="500" y="665" text-anchor="middle" font-family="'Montserrat', 'Arial', sans-serif" font-size="36" font-weight="600" letter-spacing="12" fill="#b48c58">HOSPITALITY AUDITORS</text>

  <!-- Tagline with Flanking Gold Rules -->
  <line x1="82" y1="718" x2="152" y2="718" stroke="#b48c58" stroke-width="2.5"/>
  <text x="500" y="724" text-anchor="middle" font-family="'Montserrat', 'Arial', sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#0c2340">INDEPENDENT STANDARDS. HIGHER PERFORMANCE.</text>
  <line x1="848" y1="718" x2="918" y2="718" stroke="#b48c58" stroke-width="2.5"/>

  <!-- Location: CAPE TOWN | SOUTH AFRICA -->
  <text x="500" y="770" text-anchor="middle" font-family="'Montserrat', 'Arial', sans-serif" font-size="16" font-weight="600" letter-spacing="5" fill="#0c2340">CAPE TOWN <tspan fill="#b48c58" font-weight="300"> | </tspan> SOUTH AFRICA</text>
</svg>
